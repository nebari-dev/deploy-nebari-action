name: Deploy Nebari
description: >-
  Deploy a Nebari platform from a config file using the nic CLI, and destroy it
  automatically when the job ends (post step), even on failure or cancellation.
  Acquires nic from a prebuilt binary (nic-binary) or a release or Git ref
  (nic-version). Exports KUBECONFIG so the steps after this action run against
  the deployed cluster, and by default waits for the deployment to converge:
  nebari-root Synced, every Argo CD Application Healthy, and that state stable
  across consecutive polls. Exposes the platform's entry points as outputs:
  admin credentials (masked), the gateway address, and the Keycloak issuer
  URL. Platform outputs are read with `nic outputs`, which resolves all
  fields or none: when any field cannot be resolved, every platform output
  is empty and a warning names each unresolved field and why. Extraction
  never fails an otherwise successful deploy.
author: Nebari
branding:
  icon: upload-cloud
  color: purple

inputs:
  config:
    description: >-
      Path to the NIC config file, relative to the workspace. When unset, the
      action deploys its built-in default: a local kind cluster with an
      auto-created local gitops repository (see default-config.yaml in the
      action repository). Copy it into your repository as a starting point for
      a custom config.
    required: false
    default: ''
  nic-binary:
    description: >-
      Path to a local prebuilt nic binary. Set exactly one of nic-binary and
      nic-version.
    required: false
    default: ''
  nic-version:
    description: >-
      NIC version to acquire. Mutually exclusive with nic-binary.
        - 'latest': download the latest release binary (checksum- and
          provenance-verified).
        - 'vX.Y.Z': download that release binary (checksum- and
          provenance-verified). Must be v0.10.0 or newer; earlier releases
          have no provenance attestation and are refused.
        - any other string: fetch that Git ref (branch, tag, or commit SHA)
          of nebari-dev/nebari-infrastructure-core and build from source
          (requires Go, e.g. via actions/setup-go).
    required: false
    default: ''
  wait:
    description: >-
      Wait for the deployment to converge after deploy (nebari-root Synced, all
      Argo CD Applications Healthy, stable across consecutive polls).
    required: false
    default: 'true'
  wait-timeout:
    description: Seconds to wait for Applications to converge.
    required: false
    default: '1200'
  restart-budgets:
    description: >-
      Comma-separated namespace=count pairs overriding the per-namespace
      container restart budgets the wait uses to fail fast on crashloops
      (e.g. 'keycloak=12,cnpg-system=8'). Use `*=count` to override the
      budget for namespaces without a specific override. Only used when wait
      is true.
    required: false
    default: ''
  destroy:
    description: Destroy the deployment in the post step when the job ends.
    required: false
    default: 'true'
  force:
    description: >-
      Pass --force to nic destroy so teardown continues past individual resource
      failures.
    required: false
    default: 'true'
  token:
    description: >-
      GitHub token used to resolve and download NIC releases (nic-version mode).
    required: false
    default: ${{ github.token }}

outputs:
  kubeconfig:
    description: >-
      Path to a kubeconfig for the deployed cluster (also exported as
      KUBECONFIG).
  nic-binary:
    description: >-
      Path to the nic binary used, for running further nic commands in later
      steps.
  domain:
    description: >-
      The domain the platform was deployed with (e.g. nebari.local),
      including NIC's defaulting when the config omits it. Reported by
      `nic outputs`, so it always matches what the deploying binary
      rendered. Handy for building the hostnames consumers route to
      (keycloak.<domain>, etc.). Empty when the platform outputs could not
      be read.
  keycloak-issuer-url:
    description: >-
      External public issuer URL for the Keycloak deployment (e.g.,
      https://keycloak.nebari.local). This is the value Keycloak embeds in the `iss`
      claim of its tokens, useful for JWT validation in e2e tests. NIC only
      defines an issuer URL when the config sets an explicit domain, so on
      configs relying on domain defaulting this field cannot be read and no
      platform outputs are exported. Set `domain` in the config to populate
      them.
  keycloak-admin-password:
    description: >-
      Keycloak admin password for the *master* realm, masked in logs. Use
      keycloak-realm-admin-password for the nebari realm. Empty when the platform
      outputs could not be read.
  keycloak-realm-admin-password:
    description: >-
      Keycloak admin password for the *nebari* realm, masked in logs. NIC
      provisions the backing secret eagerly at deploy time, so on a healthy
      platform it is always present. Empty when the platform outputs could
      not be read.
  argocd-admin-password:
    description: >-
      ArgoCD initial admin password, masked in logs. ArgoCD recommends
      deleting the backing secret after changing the admin password, so on a
      platform where that was done this field cannot be read and no
      platform outputs are exported.
  gateway-address:
    description: >-
      Address of the LoadBalancer service owned by NIC's nebari-gateway
      Gateway: the hostname when the LB publishes one (e.g. AWS ELB), the IP
      otherwise (MetalLB on the default local kind cluster). Empty when the platform
      outputs could not be read.

runs:
  using: node24
  main: dist/index.js
  post: dist/post.js
