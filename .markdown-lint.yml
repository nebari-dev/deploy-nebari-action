# See: https://github.com/DavidAnson/markdownlint

# Unordered list style
MD004:
  style: dash

# Disable line length checks: paragraphs are kept on a single line, and the
# inputs/outputs tables are generated from action.yml by action-docs
MD013: false

# Allow the inline HTML action-docs emits inside generated table cells
MD033:
  allowed_elements:
    - p
    - ul
    - li
    - code

# Ordered list item prefix
MD029:
  style: one

# Spaces after list markers
MD030:
  ul_single: 1
  ol_single: 1
  ul_multi: 1
  ol_multi: 1

# Code block style
MD046:
  style: fenced
