# Built-in default config for the deploy action: a local kind cluster with
# the full NIC platform, suitable for CI out of the box.
#
# Used when the action's `config` input is not set. Everything here relies on
# NIC defaults: the local repository provider auto-creates the gitops
# repository at ~/.nic/gitops/<project_name> and mounts it into the cluster,
# and MetalLB's address pool is derived from the kind Docker network.
#
# To customize the deployment, copy this file into your repo and edit it. Then
# pass it via the `config` input instead

project_name: nic-ci
domain: nebari.local
certificate:
  type: selfsigned

cluster:
  local: {}

repository:
  local: {}
