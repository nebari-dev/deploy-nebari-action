name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      # Regenerate the README's inputs/outputs tables from action.yml and
      # fail when the committed README is out of date (run `npm run bundle`).
      - name: Check Docs
        id: npm-docs-check
        run: |
          npm run docs
          npx prettier --write README.md
          git diff --exit-code README.md

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      # Deploys the built-in default config (a local kind cluster with the
      # full platform) using the latest nic release, and destroys it in the
      # action's post step.
      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          nic-version: latest

      - name: Check cluster
        id: output
        run: |
          echo "kubeconfig: ${{ steps.test-action.outputs.kubeconfig }}"
          kubectl get pods -A
