name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      # Regenerate the README's inputs/outputs tables from action.yml and
      # fail when the committed README is out of date (run `npm run bundle`).
      - name: Check Docs
        id: npm-docs-check
        run: |
          npm run docs
          npx prettier --write README.md
          git diff --exit-code README.md

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      # Deploys the built-in default config (a local kind cluster with the
      # full platform) using the latest nic release, and destroys it in the
      # action's post step.
      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          nic-version: latest

      - name: Check cluster
        id: output
        run: |
          echo "kubeconfig: ${{ steps.test-action.outputs.kubeconfig }}"
          kubectl get pods -A

      # Hard assertion that the real `nic outputs` passthrough works
      # end-to-end: the unit tests mock the subprocess and every failure
      # degrades to empty outputs plus a warning, so a renamed JSON key or
      # flag would otherwise ship green with six empty outputs. The default
      # config pins domain: nebari.local, so all six fields must resolve.
      # The emptiness loop catches a renamed upstream key (which maps to ''
      # with no warning at all), and the value checks catch a wrong value.
      - name: Check platform outputs
        env:
          DOMAIN: ${{ steps.test-action.outputs.domain }}
          ISSUER: ${{ steps.test-action.outputs.keycloak-issuer-url }}
          GATEWAY: ${{ steps.test-action.outputs.gateway-address }}
          KC_ADMIN: ${{ steps.test-action.outputs.keycloak-admin-password }}
          KC_REALM: >-
            ${{ steps.test-action.outputs.keycloak-realm-admin-password }}
          ARGOCD: ${{ steps.test-action.outputs.argocd-admin-password }}
        run: |
          rc=0
          for n in DOMAIN ISSUER GATEWAY KC_ADMIN KC_REALM ARGOCD; do
            if [ -z "${!n}" ]; then
              echo "::error::platform output $n is empty"
              rc=1
            fi
          done
          if [ "$DOMAIN" != "nebari.local" ]; then
            echo "::error::domain is '$DOMAIN', expected nebari.local"
            rc=1
          fi
          exit "$rc"
