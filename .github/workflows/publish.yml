name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  update-major-tag:
    name: Update Major Version Tag
    runs-on: ubuntu-latest

    steps:
      # When a release is published, point the floating major version tag (e.g. v0)
      # at the released tag so consumers can track a release with
      # `uses: nebari-dev/deploy-nebari-action@v0`.
      - name: Update the major version tag
        id: publish
        uses: actions/publish-action@v0.4.0
        with:
          source-tag: ${{ github.event.release.tag_name }}
